version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: testcraft
      POSTGRES_PASSWORD: testcraft
      POSTGRES_DB: testcraft
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 宿主机端口可通过 .env 的 DB_HOST_PORT 覆盖，默认 5433 以避开本机已装的 PostgreSQL(5432)。
      # 仅用于从宿主机/外部用工具连库；容器间通信走内网 db:5432，与此无关。
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://testcraft:testcraft@db:5432/testcraft
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./prompts:/app/prompts
      - ./skills:/app/skills
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
