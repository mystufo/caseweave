version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: caseweave
      POSTGRES_PASSWORD: caseweave
      POSTGRES_DB: caseweave
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 宿主机端口可通过 .env 的 DB_HOST_PORT 覆盖，默认 5433 以避开本机已装的 PostgreSQL(5432)。
      # 仅用于从宿主机/外部用工具连库；容器间通信走内网 db:5432，与此无关。
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseweave"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://caseweave:caseweave@db:5432/caseweave
      # 把宿主机 Node 运行时挂到 /opt/node，其 bin 加进 PATH，供 lark-cli(Node 程序)使用
      PATH: "/opt/node/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./prompts:/app/prompts
      - ./skills:/app/skills
      # 复用宿主机的 lark-cli：挂载 Node 运行时(含全局 @larksuite/cli) + 登录凭证目录。
      # 路径按你的机器覆盖：LARK_NODE_DIR 指向 nvm 里的某个 node 版本目录，LARK_CLI_HOME 为 ~/.lark-cli。
      # 未装 lark-cli 的机器：变量留空/路径不存在时会挂成空目录，飞书导入优雅失败，不影响其他功能。
      - ${LARK_NODE_DIR:-/root/.nvm/versions/node/v24.14.0}:/opt/node:ro
      - ${LARK_CLI_HOME:-/root/.lark-cli}:/root/.lark-cli
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 本地开源 embedding 服务（HuggingFace Text Embeddings Inference）。
  # 用户不配置远程 EMBEDDING_API_KEY 时，backend 默认走内网 http://embedding:80/v1，
  # 让知识库语义检索开箱即用（模型 BAAI/bge-m3，1024 维，多语言/中文友好）。
  # 首次启动会下载模型权重（~2GB，几分钟），存入 embedding_data 卷避免每次重拉。
  # backend 故意不 depends_on 本服务：TEI 冷启动慢，靠 embeddings.py 的 fail-open
  # 降级兜底（未就绪时暂无语义检索，就绪后自动恢复），不拖慢后端启动。
  # 架构覆盖：x86 用默认 cpu-1.9；Apple Silicon/ARM 服务器设 EMBEDDING_IMAGE=...:cpu-arm64-1.9。
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command: ["--model-id", "BAAI/bge-m3", "--auto-truncate"]
    volumes:
      - embedding_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  embedding_data:
