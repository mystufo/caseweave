# Alembic config — async-friendly setup wired to app.config.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# 不在这里写死 DB URL —— env.py 从 app.config 读 .env 的 database_url，
# 保证 alembic 与运行时连接到同一份数据库。

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
